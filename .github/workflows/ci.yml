name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e .

      - name: Write minimal config
        run: |
          cat > menu.json << 'JSON'
          {
            "namespace": "demo",
            "menu_id": "shop",
            "pages": [
              {
                "index": 0,
                "name": "Main",
                "widgets": [
                  {
                    "kind": "button",
                    "slot": 13,
                    "item": "minecraft:diamond",
                    "name": { "text": "Get Diamond", "color": "aqua" },
                    "commands": ["give @s minecraft:diamond 1"]
                  },
                  { "kind": "close", "slot": 26 }
                ]
              }
            ]
          }
          JSON

      - name: Generate folder
        run: |
          guigenmc generate menu.json -f
          test -f shop_datapack/pack.mcmeta
          test -f shop_datapack/data/demo/function/core/load.mcfunction

      - name: Generate zip + validate + tree
        run: |
          guigenmc generate menu.json -z -f -o shop.zip
          guigenmc validate menu.json
          guigenmc tree menu.json

      - name: UI static present
        run: test -f $(python -c "import guigenmc, pathlib; print(pathlib.Path(guigenmc.__file__).parent / 'static' / 'index.html')")


      - name: Build sdist + wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: datapack-${{ matrix.os }}-py${{ matrix.python-version }}
          path: shop.zip
          retention-days: 3
